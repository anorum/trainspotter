# Example camera roster.
#
# `blockade-inventory resolve` generates the real config/cameras.yaml once an ODOT
# subscription key exists. Until then this file documents the shape, and a
# hand-written cameras.yaml with `source: manual` works identically -- the poller
# never talks to the ODOT API, only to the image URLs listed here.
#
# Camera names are from DESIGN.md section 2.1. The image_url values below are
# PLACEHOLDERS: the real ones come from the inventory endpoint's per-camera URL
# field. Do not guess them into cameras.yaml -- an unverified URL that 404s looks
# identical in the metrics to a camera that is genuinely down.
#
# lat/lon are optional and feed the map pin only: a crossing takes the coordinates
# of the first camera that carries them, and has no pin if none do. `notes` is
# free text for humans; nothing parses it.

cameras:
  - camera_id: odot-PLACEHOLDER-1
    name: Portland - 11th at Milwaukie N
    crossing_id: SE_11TH_MILWAUKIE
    image_url: https://tripcheck.com/RoadCams/cams/PLACEHOLDER.jpg
    source: manual
    lat: 45.50329
    lon: -122.65457
    poll_interval_seconds: 30.0
    enabled: true
    notes: 11th northbound approach

  - camera_id: odot-PLACEHOLDER-2
    name: Portland - 11th at Milwaukie S
    crossing_id: SE_11TH_MILWAUKIE
