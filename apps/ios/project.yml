# XcodeGen spec - `xcodegen generate` turns this into PDXTrain.xcodeproj.
# The project file itself is generated and gitignored; this yaml is the truth.
name: PDXTrain
options:
  bundleIdPrefix: com.alexnorum
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic
    # The paid team, by ID - the personal team was retired because its
    # certificates carry an email address rather than a team name.
    DEVELOPMENT_TEAM: NLBQK8HWCV
targets:
  PDXTrain:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - PDXTrainTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexnorum.PDXTrain
        # iPhone-only for the first release: the glance is a pocket product,
        # and shipping an untested iPad layout helps no one. Revisit with a
        # real iPad pass.
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - Sources/App
      - Sources/Shared
    info:
      path: Sources/App/Info.plist
      properties:
        # Ink from the first frame - a white flash before a dark app reads
        # as a glitch.
        UILaunchScreen:
          UIColorName: LaunchInk
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: PDX Train
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: PDXTrainWidget
      - target: PDXTrainWatch
        embed: true
  PDXTrainTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - Tests
    dependencies:
      - target: PDXTrain
  PDXTrainWidget:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexnorum.PDXTrain.Widget
        TARGETED_DEVICE_FAMILY: "1"
    sources:
      - Sources/Widget
      - Sources/Shared
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: PDX Train
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  PDXTrainWatch:
    type: application
    platform: watchOS
    sources:
      - Sources/WatchApp
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexnorum.PDXTrain.watchkitapp
    info:
      path: Sources/WatchApp/Info.plist
      properties:
        CFBundleDisplayName: PDX Train
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.alexnorum.PDXTrain
    dependencies:
      - target: PDXTrainWatchWidget
        embed: true
  PDXTrainWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - Sources/WatchWidget
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexnorum.PDXTrain.watchkitapp.widget
    info:
      path: Sources/WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: PDX Train
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
