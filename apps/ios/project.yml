# XcodeGen spec - `xcodegen generate` turns this into PDXTrain.xcodeproj.
# The project file itself is generated and gitignored; this yaml is the truth.
name: PDXTrain
options:
  bundleIdPrefix: com.alexnorum
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic
targets:
  PDXTrain:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexnorum.PDXTrain
    sources:
      - Sources/App
      - Sources/Shared
    info:
      path: Sources/App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: PDX Train
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: PDXTrainWidget
      - target: PDXTrainWatch
        embed: true
  PDXTrainWidget:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexnorum.PDXTrain.Widget
    sources:
      - Sources/Widget
      - Sources/Shared
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: PDX Train
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  PDXTrainWatch:
    type: application
    platform: watchOS
    sources:
      - Sources/WatchApp
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexnorum.PDXTrain.watchkitapp
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.alexnorum.PDXTrain
        INFOPLIST_KEY_CFBundleDisplayName: PDX Train
    info:
      path: Sources/WatchApp/Info.plist
      properties:
        CFBundleDisplayName: PDX Train
        WKApplication: true
    dependencies:
      - target: PDXTrainWatchWidget
        embed: true
  PDXTrainWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - Sources/WatchWidget
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexnorum.PDXTrain.watchkitapp.widget
    info:
      path: Sources/WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: PDX Train
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
