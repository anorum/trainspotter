# XcodeGen spec - `xcodegen generate` turns this into PDXTrain.xcodeproj.
# The project file itself is generated and gitignored; this yaml is the truth.
name: PDXTrain
options:
  bundleIdPrefix: com.alexnorum
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic
targets:
  PDXTrain:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - Sources/Shared
    info:
      path: Sources/App/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: PDX Train
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: PDXTrainWidget
  PDXTrainWidget:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Widget
      - Sources/Shared
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: PDX Train
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
