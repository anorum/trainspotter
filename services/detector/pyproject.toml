[project]
name = "blockade-detector"
version = "0.1.0"
description = "Consumes frame metadata, scores frames, publishes raw detections."
readme = "../../README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }

dependencies = [
    "blockade-core[vision]",
    "typer>=0.12",
    "prometheus-client>=0.20",
]

[project.scripts]
blockade-detect = "detector.runner:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detector"]
