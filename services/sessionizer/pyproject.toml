[project]
name = "blockade-sessionizer"
version = "0.1.0"
description = "Turns the observation stream into blockage sessions and alerts."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }

dependencies = [
    "blockade-core[kafka]",
    "prometheus-client>=0.20",
    "typer>=0.12",
]

[project.scripts]
blockade-sessionizer = "sessionizer.runner:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sessionizer"]
