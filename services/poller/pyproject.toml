[project]
name = "blockade-poller"
version = "0.1.0"
description = "Scrapes ODOT camera stills to object storage and publishes frame metadata."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }

dependencies = [
    "blockade-core[kafka]",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "typer>=0.12",
]

[project.scripts]
blockade-capture = "poller.poller:app"
blockade-inventory = "poller.inventory:app"
blockade-sync = "poller.sync:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poller"]
