[project]
name = "blockade-api"
version = "0.1.0"
description = "Serving layer: the live board, frames, and history over HTTP."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "blockade-core[kafka]",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "prometheus-client>=0.20",
    "asyncpg>=0.29",
]

[project.scripts]
blockade-api = "api.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
