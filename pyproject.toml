# Workspace root. Not a package itself - it defines the members and the shared
# tooling configuration.
#
# Split this way because poller and detector deploy independently but share the
# record definitions that are the contract between them. One copy of schemas.py,
# several services, no drift.
[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
blockade-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.2",
    "onnxruntime>=1.18",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    # The extras the test suite imports, so a bare `uv sync` reproduces the
    # test environment instead of depending on a flag someone has to remember.
    # train is deliberately absent: torch is ~2GB of workstation-only weight
    # and does not belong in every dev checkout.
    "blockade-core[vision,vlm,kafka]",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008 forbids function calls in argument defaults, but `typer.Option(...)` in a
# default is exactly how Typer declares CLI options. Scoped to the CLI
# entrypoints rather than disabled globally, where the check is worth keeping.
"services/poller/src/poller/inventory.py" = ["B008"]
"services/poller/src/poller/poller.py" = ["B008"]
"services/poller/src/poller/sync.py" = ["B008"]
"services/detector/src/detector/runner.py" = ["B008"]
"services/api/src/api/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
