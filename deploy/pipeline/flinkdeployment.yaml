---
# The `flink` ServiceAccount this deployment runs as is owned by the platform:
# the flink-operator chart renders one into each namespace it watches. The
# IRSA role (blockade-flink, checkpoint prefix only) binds to that SA by name;
# the ARN lives in the imperative `aws-roles` Secret, never in git.
# The job as a declarative resource. The operator turns this into a JobManager
# Deployment, a TaskManager pod, and a running job - and owns the operational
# folklore: crash recovery from the latest checkpoint, restarts, and (when
# upgradeMode graduates to savepoint) draining state before an upgrade.
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: blockade-pipeline
  namespace: blockade
spec:
  image: ghcr.io/anorum/trainspotter/pipeline:latest
  flinkVersion: v1_20
  serviceAccount: flink
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "1"
    # Three keys and tiny state: the hashmap backend keeps it on-heap, and
    # checkpoints ship the whole (kilobytes-sized) state to S3 every minute.
    # RocksDB would buy incremental checkpoints nobody needs at this scale.
    state.backend.type: hashmap
    state.checkpoints.dir: s3://pdx-trainspotter/flink/checkpoints
    state.savepoints.dir: s3://pdx-trainspotter/flink/savepoints
    execution.checkpointing.interval: 60s
    # IRSA: the S3 filesystem exchanges the projected token via STS, same
    # mechanism as every other pod here, no stored credential.
    fs.s3a.aws.credentials.provider: com.amazonaws.auth.WebIdentityTokenCredentialsProvider
    python.executable: /opt/pyflink-env/bin/python
    python.client.executable: /opt/pyflink-env/bin/python
  podTemplate:
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: flink-main-container
          env:
            - name: BLOCKADE_KAFKA_BOOTSTRAP
              value: blockade-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: AWS_ROLE_ARN
              valueFrom:
                secretKeyRef:
                  name: aws-roles
                  key: flink
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
            - name: AWS_REGION
              value: us-west-2
          volumeMounts:
            - name: aws-token
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true
      volumes:
        - name: aws-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token
  jobManager:
    resource:
      memory: 1024m
      cpu: 0.25
  taskManager:
    resource:
      # The JVM plus a Python worker process live inside this. Sized from the
      # node headroom (~2.4Gi free each) rather than from Flink defaults,
      # which assume machines this cluster does not have.
      memory: 1536m
      cpu: 0.5
  job:
    jarURI: local:///opt/flink/opt/flink-python-1.20.3.jar
    entryClass: org.apache.flink.client.python.PythonDriver
    args: ["-pyclientexec", "/opt/pyflink-env/bin/python", "-py", "/opt/flink/usrlib/job.py"]
    parallelism: 1
    # stateless: an upgrade restarts from the latest checkpoint's Kafka offsets
    # committed by the source, not from a savepoint. Correct for now because
    # the whole output is deterministic and replay-safe; graduate to
    # last-state/savepoint when replaying history stops being cheap.
    upgradeMode: stateless
