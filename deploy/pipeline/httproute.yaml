---
# The Flink web UI: job graph, per-operator watermarks, checkpoint history,
# backpressure. Served by the JobManager itself on the rest Service the
# operator creates - nothing extra runs to provide this. Read-only in effect:
# job submission through it is disabled in application mode, and cancelling
# the job is harmless - the operator's reconcile loop resurrects it from the
# FlinkDeployment spec.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flink-ui
  namespace: blockade
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Blockade pipeline job
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/name: Flink
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    - flink.home.alexnorum.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: blockade-pipeline-rest
          port: 8081
