---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: blockade-capture
  namespace: blockade
spec:
  selector:
    matchLabels:
      app: poller
  endpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: blockade-capture
  namespace: blockade
spec:
  groups:
    - name: blockade-capture
      rules:
        # The alert that matters. ODOT overwrites each image with the next, so a
        # stalled camera is data permanently lost -- not a delay, a hole.
        - alert: BlockadeCameraStalled
          expr: time() - blockade_last_new_frame_timestamp > 900
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "No new frame from {{ $labels.camera_id }} in 15 minutes"
            description: >-
              Either the camera is down or its refresh interval changed. Frames
              missed now cannot be recovered later.

        - alert: BlockadeAllCamerasStalled
          expr: min(time() - blockade_last_new_frame_timestamp) > 900
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "No new frames from any camera in 15 minutes"
            description: >-
              Points at the poller, the network, or a revoked key rather than a
              single camera fault.

        # Every rule above is a threshold over a poller metric, so all four go
        # quiet together the moment those series stop existing -- a dead pod, a
        # crash loop, a scrape that never matched. `absent` is the only form
        # that fires on nothing: it holds when the metric is missing, which is
        # the failure the other rules are structurally unable to see.
        - alert: BlockadePollerMetricsMissing
          expr: absent(blockade_last_new_frame_timestamp)
          # The same 15-minute budget the stall rules allow, spent here entirely
          # on `for`: absent() is true the instant the series go, and a Recreate
          # rollout of a single replica pulling :latest onto a Pi is a legitimate
          # gap. Below this a routine deploy pages critical.
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Poller metrics have stopped arriving"
            description: >-
              No blockade_last_new_frame_timestamp series exists, so every
              other capture alert is blind. The poller is down, crash-looping,
              or no longer being scraped, and frames are being lost for real.

        - alert: BlockadeCameraErroring
          expr: blockade_consecutive_errors > 10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.camera_id }} has failed {{ $value }} consecutive polls"

        # A camera whose every poll is a duplicate is either frozen or refreshing
        # far slower than assumed. Both change what the detector should trust.
        # Errors are excluded from the right operand deliberately: a camera that
        # only ever fails is served nothing to be a duplicate of, and
        # BlockadeCameraErroring is the rule that describes it.
        - alert: BlockadeCameraAllDuplicates
          expr: |
            sum by (camera_id) (rate(blockade_frames_total{status="ok"}[1h])) == 0
            and sum by (camera_id) (rate(blockade_frames_total{status!="error"}[1h])) > 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.camera_id }} served no new image for an hour"
