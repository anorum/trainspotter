---
apiVersion: v1
kind: Namespace
metadata:
  name: blockade
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: poller
  namespace: blockade
  # IRSA role: blockade-poller. On EKS an annotation here would drive a
  # mutating webhook; k3s has none, so the Deployment wires the env vars by
  # hand. The ARN lives in the imperative `aws-roles` Secret, never in git.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: poller-state
  namespace: blockade
spec:
  accessModes: [ReadWriteOnce]
  # The 12TB HDD, not the default class. local-path writes to the Pi's boot
  # media, which the poller would wear out with a continuous frame stream, and
  # its Delete reclaim policy is wrong for the manifest - the manifest is the
  # outbox, and losing it loses the record of what has been published.
  storageClassName: local-hdd-storage
  volumeName: blockade-poller-state-pv
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poller
  namespace: blockade
  labels:
    app: poller
  annotations:
    # The cluster runs Reloader: editing the camera roster ConfigMap restarts
    # this Deployment, so adding a camera is a config commit rather than a
    # rebuild.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Recreate, not RollingUpdate. Two pollers briefly overlapping would double
  # the request rate against ODOT, and a revoked key ends the project.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: poller
  template:
    metadata:
      labels:
        app: poller
    spec:
      serviceAccountName: poller
      # Private GHCR package, same pattern as alex-api. Created imperatively per
      # namespace rather than committed - it is a registry credential, not
      # application config, and CI never needs it (it pushes with its own
      # GITHUB_TOKEN). Scope is read:packages only.
      imagePullSecrets:
        - name: regcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: poller
          image: ghcr.io/anorum/trainspotter/poller:latest
          args: ["run"]
          ports:
            - name: metrics
              containerPort: 9102
          env:
            # --- IRSA. No stored credential: boto3 reads these three, exchanges
            # the projected token with STS, and refreshes on its own.
            - name: AWS_ROLE_ARN
              valueFrom:
                secretKeyRef:
                  name: aws-roles
                  key: poller
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
            - name: AWS_REGION
              value: us-west-2
            - name: BLOCKADE_S3_BUCKET
              value: pdx-trainspotter
            - name: BLOCKADE_S3_REGION
              value: us-west-2
            # Cross-namespace service DNS: the broker lives in the kafka
            # namespace. Unset, the poller runs capture-only and the manifest
            # accumulates - capture must never depend on Kafka being up.
            - name: BLOCKADE_KAFKA_BOOTSTRAP
              value: blockade-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: BLOCKADE_USER_AGENT
              valueFrom:
                secretKeyRef:
                  name: odot-credentials
                  key: BLOCKADE_USER_AGENT
          envFrom:
            - secretRef:
                name: odot-credentials
          volumeMounts:
            - name: state
              mountPath: /var/lib/blockade
            - name: cameras
              mountPath: /app/config
              readOnly: true
            - name: aws-token
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              # No CPU limit on purpose: throttling the poll loop would skew
              # captured_at and widen the very gaps this project measures.
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: poller-state
        - name: cameras
          configMap:
            name: blockade-cameras
        - name: aws-token
          projected:
            sources:
              - serviceAccountToken:
                  # The audience must match the trust policy exactly; STS
                  # rejects the token otherwise. One hour, rotated by kubelet.
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: poller
  namespace: blockade
  labels:
    app: poller
spec:
  selector:
    app: poller
  ports:
    - name: metrics
      port: 9102
      targetPort: metrics
