---
apiVersion: v1
kind: Namespace
metadata:
  name: blockade
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: poller
  namespace: blockade
  annotations:
    # Documentation only. On EKS this annotation drives a mutating webhook that
    # injects the credential env vars and token volume automatically. k3s has no
    # such webhook, so the Deployment below wires them by hand - the annotation
    # is kept so the intent is visible where people expect to find it.
    eks.amazonaws.com/role-arn: ${AWS_ROLE_ARN}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: poller-state
  namespace: blockade
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      # Working state, not the archive. The manifest is the outbox: records land
      # here first and are published from here, so it must survive a restart.
      # Frames and manifests both go to S3, so losing this volume costs a
      # republish rather than data.
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: poller
  namespace: blockade
  labels:
    app: poller
  annotations:
    # The cluster runs Reloader: editing the camera roster ConfigMap restarts
    # this Deployment, so adding a camera is a config commit rather than a
    # rebuild.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Recreate, not RollingUpdate. Two pollers briefly overlapping would double
  # the request rate against ODOT, and a revoked key ends the project.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: poller
  template:
    metadata:
      labels:
        app: poller
    spec:
      serviceAccountName: poller
      # Private GHCR package, same pattern as alex-api. Created imperatively per
      # namespace rather than committed - it is a registry credential, not
      # application config, and CI never needs it (it pushes with its own
      # GITHUB_TOKEN). Scope is read:packages only.
      imagePullSecrets:
        - name: regcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: poller
          image: ghcr.io/anorum/trainspotter/poller:latest
          args: ["run"]
          ports:
            - name: metrics
              containerPort: 9102
          env:
            # --- IRSA. No stored credential: boto3 reads these three, exchanges
            # the projected token with STS, and refreshes on its own.
            - name: AWS_ROLE_ARN
              value: ${AWS_ROLE_ARN}
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
            - name: AWS_REGION
              value: us-west-2
            - name: BLOCKADE_S3_BUCKET
              value: pdx-trainspotter
            - name: BLOCKADE_S3_REGION
              value: us-west-2
            - name: BLOCKADE_USER_AGENT
              valueFrom:
                secretKeyRef:
                  name: odot-credentials
                  key: BLOCKADE_USER_AGENT
          envFrom:
            - secretRef:
                name: odot-credentials
          volumeMounts:
            - name: state
              mountPath: /var/lib/blockade
            - name: cameras
              mountPath: /app/config
              readOnly: true
            - name: aws-token
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              # No CPU limit on purpose: throttling the poll loop would skew
              # captured_at and widen the very gaps this project measures.
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: poller-state
        - name: cameras
          configMap:
            name: blockade-cameras
        - name: aws-token
          projected:
            sources:
              - serviceAccountToken:
                  # The audience must match the trust policy exactly; STS
                  # rejects the token otherwise. One hour, rotated by kubelet.
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: poller
  namespace: blockade
  labels:
    app: poller
spec:
  selector:
    app: poller
  ports:
    - name: metrics
      port: 9102
      targetPort: metrics
