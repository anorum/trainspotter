---
# Single-broker Kafka in KRaft mode, sized for two 8GB Raspberry Pis.
#
# Not applied yet: stage 1 (the poller capturing to S3 from the cluster) has to
# prove out first. Bringing up Kafka before there is anything to publish would
# mean debugging two layers at once, which is exactly what the staged rollout
# exists to avoid.
#
# Requires the Strimzi operator:
#   kubectl create namespace kafka
#   kubectl apply -f 'https://strimzi.io/install/latest?namespace=kafka' -n kafka
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: blockade
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 50Gi
        # The HDD, not the default class. Kafka rewrites log segments constantly,
        # which on the Pi's boot flash is a wear problem rather than a capacity
        # one - and the default class also carries a Delete reclaim policy.
        class: local-hdd-storage
        # Retained on delete. Kafka here is a transport, not the archive - the
        # corpus lives in S3 - but losing the volume mid-flight would drop
        # records the outbox had already marked published.
        deleteClaim: false
  resources:
    requests:
      memory: 1Gi
      cpu: 200m
    limits:
      memory: 1400Mi
  jvmOptions:
    # Deliberately small. Two nodes with ~6.7Gi free between them also have to
    # carry Flink, and an oversized heap here is memory the stream processor
    # cannot have.
    -Xms: 768m
    -Xmx: 768m
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: blockade
  namespace: kafka
spec:
  kafka:
    # Pinned deliberately: an unpinned version would let an operator upgrade
    # move the broker underneath us. metadataVersion is omitted so the operator
    # picks the default matching this version rather than us hand-writing a
    # format string that has to be kept in sync.
    version: 4.2.1
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # One broker, so nothing can be replicated. This is a homelab tradeoff,
      # not a recommendation: production would be three brokers with RF=3. It is
      # acceptable only because Kafka is not the system of record here - every
      # record is derivable again from the frames in S3.
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
  entityOperator:
    topicOperator:
      resources:
        requests: { memory: 256Mi, cpu: 50m }
        limits: { memory: 384Mi }
    userOperator:
      resources:
        requests: { memory: 256Mi, cpu: 50m }
        limits: { memory: 384Mi }
