---
# Manually declared because local-hdd-storage has no provisioner. The directory
# must already exist on swagman-2; deploy/kafka/README.md has the Job that
# creates it.
#
# Strimzi names the claim data-0-<cluster>-<pool>-<id>, so this PV is bound by
# matching class and size rather than by claimRef - a mistyped claim name would
# leave the broker Pending with no obvious cause.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: blockade-kafka-0-pv
spec:
  capacity:
    storage: 50Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-hdd-storage
  local:
    path: /mnt/hd/blockade/kafka-0
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [swagman-2]
