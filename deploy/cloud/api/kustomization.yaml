# API on the cloud box: IRSA -> static keys, bus -> Redpanda, and the
# homelab HTTPRoute gives way to a NodePort (30080) that host-level
# cloudflared fronts for pdxtrain.com. No Prometheus stack.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../api
patches:
  - target:
      kind: HTTPRoute
      name: blockade-ui
    patch: |
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: blockade-ui
        namespace: blockade
      $patch: delete
  - target:
      kind: ServiceMonitor
      name: api
    patch: |
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: api
        namespace: blockade
      $patch: delete
  - target:
      kind: Deployment
      name: api
    patch: |
      - op: test
        path: /spec/template/spec/containers/0/env/0/name
        value: AWS_ROLE_ARN
      - op: remove
        path: /spec/template/spec/containers/0/env/0
      - op: test
        path: /spec/template/spec/containers/0/env/0/name
        value: AWS_WEB_IDENTITY_TOKEN_FILE
      - op: remove
        path: /spec/template/spec/containers/0/env/0
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - secretRef:
              name: aws-credentials
      - op: test
        path: /spec/template/spec/containers/0/env/3/name
        value: BLOCKADE_KAFKA_BOOTSTRAP
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: redpanda.blockade.svc.cluster.local:9092
      - op: test
        path: /spec/template/spec/containers/0/volumeMounts/1/name
        value: aws-token
      - op: remove
        path: /spec/template/spec/containers/0/volumeMounts/1
      - op: test
        path: /spec/template/spec/volumes/1/name
        value: aws-token
      - op: remove
        path: /spec/template/spec/volumes/1
  - target:
      kind: Service
      name: api
    patch: |
      - op: replace
        path: /spec/type
        value: NodePort
      - op: test
        path: /spec/ports/0/name
        value: http
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
      - op: test
        path: /spec/ports/1/name
        value: metrics
      - op: remove
        path: /spec/ports/1
