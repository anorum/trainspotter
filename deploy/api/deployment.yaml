---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api
  namespace: blockade
  # IRSA role: blockade-api, GetObject on frames/* and nothing else - the
  # serving layer reads the corpus, never writes it. The ARN lives in the
  # imperative aws-roles Secret, never in git.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: blockade
  labels:
    app: api
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      imagePullSecrets:
        - name: regcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: ghcr.io/anorum/trainspotter/api:latest
          args: ["run"]
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9102
          env:
            - name: AWS_ROLE_ARN
              valueFrom:
                secretKeyRef:
                  name: aws-roles
                  key: api
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
            - name: AWS_REGION
              value: us-west-2
            - name: BLOCKADE_S3_BUCKET
              value: pdx-trainspotter
            - name: BLOCKADE_S3_REGION
              value: us-west-2
            - name: BLOCKADE_KAFKA_BOOTSTRAP
              value: blockade-kafka-bootstrap.kafka.svc.cluster.local:9092
            # The frame LRU cache. Ephemeral on purpose: it refills from S3.
            - name: BLOCKADE_LOCAL_CACHE_DIR
              value: /tmp/cache
            # The history store. Absent, the history endpoints refuse with 503
            # - the live board never depends on the database.
            - name: BLOCKADE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: url
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: aws-token
              mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 384Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          # Readiness is the replay gate: a fresh pod answers only after the
          # Kafka tail has rebuilt the full board, so a rollout never serves
          # an empty or half-true status.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: aws-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 3600
                  path: token
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: blockade
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9102
      targetPort: metrics
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: blockade-ui
  namespace: blockade
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Is a train blocking the crossing
    gethomepage.dev/group: Apps
    gethomepage.dev/name: PDX Train
    gethomepage.dev/pod-selector: "app=api"
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: traefik
      sectionName: web
  hostnames:
    # The public name (via the Cloudflare tunnel) and the LAN name (AdGuard
    # wildcard) land on the same Traefik gateway; one route serves both.
    - pdxtrain.alexnorum.com
    - blockade.home.alexnorum.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api
          port: 80
