# Builds and publishes the service images.
#
# Runs on ubuntu-24.04-arm because the k3s nodes are Raspberry Pi 5s. A native
# arm64 runner rather than QEMU emulation, which is both far quicker and avoids
# the class of bug where a wheel builds under emulation and misbehaves on real
# hardware.
name: images

on:
  push:
    branches: [main]
    paths:
      - "libs/**"
      - "services/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      # Services publish independently, so one failing build must not withhold
      # the other. Capture in particular should be shippable on its own.
      fail-fast: false
      matrix:
        service: [poller, detector]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          # Build context is the repo root: the workspace layout means each
          # image needs libs/blockade-core alongside its own service directory.
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
