# Builds and publishes the service images.
#
# Targets linux/arm64 because the k3s nodes are Raspberry Pi 5s.
#
# Built on x86 under QEMU rather than a native arm64 runner: those are free only
# on public repositories, and this one is private. Emulated builds are slower
# (minutes, not seconds) but need no PAT and no paid plan - the workflow's own
# GITHUB_TOKEN can push to GHCR.
#
# Worth replacing with a self-hosted arm64 runner on the cluster itself, which
# would be native, consume no Actions minutes, and reach GitHub outbound only.
name: images

on:
  push:
    branches: [main]
    paths:
      - "libs/**"
      - "services/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Services publish independently, so one failing build must not withhold
      # the other. Capture in particular should be shippable on its own.
      fail-fast: false
      matrix:
        service: [poller, detector, sessionizer, api]
    steps:
      - uses: actions/checkout@v4

      # Registers binfmt handlers so the x86 runner can execute arm64 binaries.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          # Build context is the repo root: the workspace layout means each
          # image needs libs/blockade-core alongside its own service directory.
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
